<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f2ea">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css?v=5">
<title>书架</title>
</head>
<body data-view="list">
<header id="topbar">
  <button id="btn-back" class="icon" hidden>‹</button>
  <input id="search" type="search" placeholder="搜索书名（空格分隔多个词）" autocomplete="off">
  <button id="btn-settings" class="icon">Aa</button>
</header>

<main id="layout">
  <aside id="sidebar">
    <div id="list-toolbar">
      <span id="count"></span>
      <span>
        <button id="btn-search-content">搜内容</button>
        <button id="btn-scan">扫描</button>
      </span>
    </div>
    <ul id="book-list"></ul>
  </aside>

  <section id="reader" hidden>
    <div id="reader-head">
      <span id="book-title"></span>
      <button id="btn-search-book">书内搜索</button>
    </div>
    <div id="reader-text"></div>
    <div id="reader-progress"><span id="progress-label"></span></div>
  </section>
</main>

<section id="panel" hidden>
  <h3>阅读设置</h3>
  <label>字号 <input id="font-size" type="range" min="14" max="28" step="1"></label>
  <label>行距 <input id="line-height" type="range" min="1.4" max="2.2" step="0.1"></label>
  <div id="themes"></div>
  <label style="font-size:13px;color:var(--muted)">字体</label>
  <div id="fonts">
    <button data-font="sans">黑体（默认）</button>
    <button data-font="serif">宋体</button>
  </div>
  <button id="btn-close-panel">完成</button>
</section>

<div id="toast" hidden></div>
<script src="/app.js?v=5"></script>
</body>
</html>
